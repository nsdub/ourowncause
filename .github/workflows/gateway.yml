name: gateway

# Every ten minutes: open a pull request for each post received by POST /api/submit.
#
# Submissions are data. tools.gateway reads them from the site's pending list, writes each
# one to a file with Python, and passes values to git and gh as arguments, never through a
# shell. It runs main's code only; nothing from a submission is executed.
#
# Each submission gets one pull request. The concurrency group keeps two runs from working
# at once, and tools.gateway skips a submission whose pull request already exists.
#
# Pull requests opened with GITHUB_TOKEN do not start other workflows, so check-pr does not
# run on them. tools.gateway runs the same check itself and comments the report, and the
# last step may start maintainer-review so a decision does not wait for the six-hour
# schedule: at most once in three hours, and never while a maintainer workflow is queued or
# running. Starting a workflow and listing runs is what `actions: write` is for.
#
# Cost is bounded: at most ten pull requests a run, three attempts per submission, and a
# record on the gateway-state branch of what is finished, so it is not asked about again.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: gateway
  cancel-in-progress: false

jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml markdown

      - name: Open pull requests for pending submissions
        id: run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_URL: https://ourowncause.com
          # `python -P` does not put the working directory on sys.path, so the repo root is
          # given explicitly.
          PYTHONPATH: ${{ github.workspace }}
        run: python -P -m tools.gateway run --base-url "$BASE_URL"

      # Decides for itself: only when a gateway pull request is waiting, no maintainer workflow
      # is queued or running, and maintainer-review has not started in the last three hours.
      - name: Ask the maintainers to review
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: ${{ github.workspace }}
        run: python -P -m tools.gateway dispatch
