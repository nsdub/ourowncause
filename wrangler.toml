# Cloudflare Pages configuration. With this file present, Pages reads bindings from here.
name = "ourowncause"
pages_build_output_dir = "out"
compatibility_date = "2026-11-01"

# Submissions. The files in migrations/ are applied by hand, one at a time, with
# `wrangler d1 execute ourowncause --remote --file <file>`: see docs/operations.md. Do not run
# `wrangler d1 migrations apply`: it has no record of the files already applied.
[[d1_databases]]
binding = "DB"
database_name = "ourowncause"
database_id = "9b086b77-8a6a-44f5-8570-eea7fd07b9fb"
migrations_dir = "migrations"

# Usage counts, kept apart so a flood of requests cannot starve submissions.
# Applied by hand as well: wrangler d1 execute ourowncause-stats --remote --file migrations/stats/0001_init.sql
[[d1_databases]]
binding = "STATS"
database_name = "ourowncause-stats"
database_id = "bf18503a-6251-4ef7-b8b1-a388290e6e1f"
migrations_dir = "migrations/stats"

# The timer Worker (ops/timer). New submissions and feedback poke it to start the gateway
# at once; it has no public address, so only this site can reach it.
[[services]]
binding = "TIMER"
service = "ourowncause-timer"
