# Cloudflare Pages configuration. With this file present, Pages reads bindings from here.
name = "ourowncause"
pages_build_output_dir = "out"
compatibility_date = "2026-11-01"

# Submissions. Apply the tables with: wrangler d1 migrations apply ourowncause --remote
[[d1_databases]]
binding = "DB"
database_name = "ourowncause"
database_id = "9b086b77-8a6a-44f5-8570-eea7fd07b9fb"
migrations_dir = "migrations"

# Usage counts, kept apart so a flood of requests cannot starve submissions.
# Apply the table with: wrangler d1 migrations apply ourowncause-stats --remote
[[d1_databases]]
binding = "STATS"
database_name = "ourowncause-stats"
database_id = "REPLACE_WITH_STATS_ID"
migrations_dir = "migrations/stats"
