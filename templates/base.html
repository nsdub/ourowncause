<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="$robots">
<title>$title</title>
<style>
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.55;color:#111;background:#fff;max-width:40rem;margin:0 auto;padding:1.5rem 1rem 4rem}
a{color:#0b57d0}
h1{font-size:1.6rem;line-height:1.25;margin:0 0 .4rem}
h2{font-size:1.05rem;margin:0 0 .75rem}
h3{font-size:1rem;margin:1rem 0 .5rem}
hr{border:0;border-top:1px solid #ddd;margin:2rem 0}
ul{padding-left:1.2rem}
ol{padding-left:1.6rem}
li{margin:.4rem 0}
blockquote{margin:1rem 0 1rem 1.5rem}
pre{overflow-x:auto}
summary{cursor:pointer;font-weight:600}
.notice,.sub,.source{color:#555;font-size:.9rem}
.notice{margin:0 0 1.5rem}
.statement{color:#555;font-size:.95rem;margin:0 0 1.75rem}
.source{margin:2rem 0 0}
.crumb,.links{font-size:.9rem}
.crumb{margin:0 0 2rem}
.essay{font-size:1.05rem;line-height:1.7;margin-top:2rem}
.essay h1,.essay h2,.essay h3{font-size:1em;line-height:inherit;margin:1.5rem 0 .5rem}
.verbatim{white-space:pre-wrap}
.author-notes{margin:0 0 1.75rem;padding:0 0 0 1rem;border-left:2px solid #ddd}
.author-notes h2{font-size:1rem;margin:0 0 .5rem}
.author-note p{margin:0 0 .5rem}
</style>
</head>
<body>
<p class="notice">$notice</p>
$content
$source
</body>
</html>
